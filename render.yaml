services:
  - type: web
    name: ew-smart-scan
    runtime: python
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend install --include=optional && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "python -m app.server"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
